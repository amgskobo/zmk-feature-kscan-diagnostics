name: Fork review

on:
  push:
    branches: ["codex/kscan-diagnostics-review"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
      options: --cpus 3 --memory 6g
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compiler and checker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-multilib python3-venv
          python3 -m venv /tmp/kscan-checkers
          /tmp/kscan-checkers/bin/python -m pip install pre-commit==4.7.0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: ./.github/actions/west-init
      - name: Prepare locked Web environment
        working-directory: web
        run: npm ci
      - name: Prepare checker environments
        run: /tmp/kscan-checkers/bin/python -m pre_commit install-hooks
      - name: Complete owner checks
        run: /tmp/kscan-checkers/bin/python -m pre_commit run --all-files --verbose
