include:
  - artifact: kscan_diagnostics_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: kscan_diagnostics_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    # CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256: see the BUILD_ASSERT arithmetic
    # comment in src/studio/kscan_diagnostics_handler.c.
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippet: studio-rpc-usb-uart

  - artifact: kscan_diagnostics_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y

  - artifact: custom_settings_board
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_CUSTOM_SETTINGS=y -DCONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippet: studio-rpc-usb-uart

  - artifact: kscan_diagnostics_board_matrix
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippets:
      - studio-rpc-usb-uart
      - diag-matrix

  - artifact: kscan_diagnostics_board_composite
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippets:
      - studio-rpc-usb-uart
      - diag-composite

  - artifact: kscan_diagnostics_board_charlieplex_demux
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
    snippets:
      - studio-rpc-usb-uart
      - diag-charlieplex-demux

  # Split event-relay compile coverage (DESIGN.md peripheral relay section):
  # the relay TU (src/split/kscan_diagnostics_relay.c) is self-role-gating, so
  # these two artifacts prove both role paths + the BUILD_ASSERTs compile.
  # tester_xiao is unibody, so split role is forced via cmake-args; this is a
  # compile test; functional split delivery requires matching paired devices.
  - artifact: kscan_diagnostics_board_split_central
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256 -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
    snippet: studio-rpc-usb-uart

  - artifact: kscan_diagnostics_board_split_peripheral
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

  # Phase E hardware validation (DESIGN.md SS8/SS9): zmk,kscan-mock swapped in
  # for tester_xiao's baseline direct kscan so the RPC chain can be exercised
  # on a board without physical switches. Startup logging and the RTT buffer
  # are explicit fixture settings; using the artifact on a device requires
  # separate source/configuration matching and authorized hardware acceptance.
  - artifact: kscan_diagnostics_board_hw_mock
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=y -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256 -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0 -DCONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192 -DCONFIG_USE_SEGGER_RTT=y -DCONFIG_LOG_BACKEND_RTT=y -DCONFIG_LOG=y
    snippets:
      - studio-rpc-usb-uart
      - diag-hw-mock
